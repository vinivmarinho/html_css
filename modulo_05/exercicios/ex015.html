<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorthand de propriedades</title>
    <style>
        .container{
    display: grid;
    grid-template-rows: repeat(3, 100px);
    grid-template-columns: repeat(4, 1fr);
    border: 2px solid black;
}
.elemento{
    border: 2px solid black;
}
#caixa01{
    grid-row: 1 / 2; /* SHORTHAND */
    grid-column: 1 / 5; /* SHORTHAND */
    background-color: blue;
}
#caixa02{
    grid-row: 2 / 4; /* SHORTHAND */
    grid-column: 1 / 3; /* SHORTHAND */
    background-color: orange;
}
#caixa03{
    grid-row: 2 / 4; /* SHORTHAND */
    grid-column: 3 / 5; /* SHORTHAND */
    background-color: rgb(196, 188, 144);
}
    </style>
</head>
<body>
    <div class="container">
        <div class="elemento" id="caixa01">Elemento 1</div>
        <div class="elemento" id="caixa02">Elemento 2</div>
        <div class="elemento" id="caixa03">Elemento 3</div>
    </div>
</body>
</html>

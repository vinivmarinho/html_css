<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-shrink/grow</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: gray;
        }
        main{
            background-color: gold;
            width: 100vw;
            height: 90vh;
            display: flex;
            flex-flow: row nowrap;
        }
        section{
            background-color: purple;
            flex-basis: 200px;
            box-shadow: 2px 2px 10px black;
            border: 3px solid gray;
        }
        section#primeiro{
            flex-shrink: 4;
            flex-grow: 0;
            align-self: center;
        }
        #segundo{
            flex-shrink: 3;
            flex-grow: 1;
            align-self: center;
        }
            
        
        #terceiro{
            flex-shrink: 2;
            flex-grow: 0;
            align-self: center;
        }
        #quarto{
            flex-shrink: 1;
            flex-grow: 2;
            align-self: center;
        }
        
    </style>
</head>
<body>
    <main>
        <section id="primeiro">
            <h1 >Flex Shrink</h1>
        </section>
        <section id="segundo">
            <h1 >Flex Shrink</h1>
        </section>
        <section id="terceiro">
            <h1 >Flex Shrink</h1>
        </section>
        <section id="quarto">
            <h1 >Flex Shrink</h1>
        </section>
        
    </main>
</body>
</html>
